name: Create release zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v1.0.0). If empty, a short SHA will be used.'
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Create zip (exclude common large dirs)
        run: |
          zipname=repo-${{ steps.set-tag.outputs.TAG }}.zip
          rm -f "$zipname"
          zip -r "$zipname" . -x ".git/*" ".github/*" "node_modules/*" "venv/*" "__pycache__/*"
          ls -lh "$zipname"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.set-tag.outputs.TAG }}
          release_name: Release ${{ steps.set-tag.outputs.TAG }}
          body: Automated release with zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset (zip)
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./repo-${{ steps.set-tag.outputs.TAG }}.zip
          asset_name: repo-${{ steps.set-tag.outputs.TAG }}.zip
          asset_content_type: application/zip
