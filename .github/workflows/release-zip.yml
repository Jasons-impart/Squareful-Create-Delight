name: Create release zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v1.0.0). If empty, a short SHA will be used.'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: set-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_SHA::7}"
          fi
          echo "TAG=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create zip (exclude common large dirs)
        env:
          TAG: ${{ steps.set-tag.outputs.TAG }}
        run: |
          zipname="repo-${TAG}.zip"
          rm -f "$zipname"
          zip -r "$zipname" . -x ".git/*" ".github/*" "node_modules/*" "venv/*" "__pycache__/*"
          ls -lh "$zipname"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set-tag.outputs.TAG }}
          name: Release ${{ steps.set-tag.outputs.TAG }}
          body: Automated release with zip
          files: repo-${{ steps.set-tag.outputs.TAG }}.zip
          fail_on_unmatched_files: true
